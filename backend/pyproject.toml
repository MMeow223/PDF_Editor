[project]
name = "pdf-editor-backend"
version = "0.1.0"
description = "FastAPI backend for PDF editor webapp"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pymupdf>=1.25",
    "pdf2docx>=0.5.8",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
]
